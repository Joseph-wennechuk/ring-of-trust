{% extends "base.html" %}
{% block title %}Register – Ghetto-PASS{% endblock %}
{% block content %}
<div class="form-page">
  <h2 class="form-page__title">Register</h2>
  <form method="POST" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form__label">Username
      <input class="form__input" type="text" name="username" required autofocus minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+">
    </label>
    <label class="form__label">Email
      <input class="form__input" type="email" name="email" required>
    </label>
    <label class="form__label">Password
      <input class="form__input" type="password" name="password" required minlength="12" maxlength="1024">
    </label>
    <button class="btn btn--primary" type="submit">Request Access</button>
  </form>
  <p class="form-page__foot">Your request will be reviewed by an admin before access is granted.</p>
  <p class="form-page__foot"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
