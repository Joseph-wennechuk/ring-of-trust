{% extends "base.html" %}
{% block title %}Change Password – Ghetto-PASS{% endblock %}
{% block content %}
<div class="form-page">
  <h2 class="form-page__title">Change Password</h2>
  <form method="POST" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form__label">Current Password
      <input class="form__input" type="password" name="current_password" required autofocus
             autocomplete="current-password">
    </label>
    <label class="form__label">New Password (min 12 chars)
      <input class="form__input" type="password" name="new_password" required minlength="12"
             maxlength="1024" autocomplete="new-password">
    </label>
    <label class="form__label">Confirm New Password
      <input class="form__input" type="password" name="confirm_password" required minlength="12"
             maxlength="1024" autocomplete="new-password">
    </label>
    <button class="btn btn--primary" type="submit">Change Password</button>
  </form>
  <p class="form-page__foot">Changing your password logs out your other sessions.</p>
</div>
{% endblock %}
