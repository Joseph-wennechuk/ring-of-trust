{% extends "base.html" %}
{% block title %}Login – Ghetto-PASS{% endblock %}
{% block content %}
<div class="form-page">
  <h2 class="form-page__title">Login</h2>
  <form method="POST" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form__label">Username
      <input class="form__input" type="text" name="username" required autofocus>
    </label>
    <label class="form__label">Password
      <input class="form__input" type="password" name="password" required>
    </label>
    <button class="btn btn--primary" type="submit">Login</button>
  </form>
  <p class="form-page__foot">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
